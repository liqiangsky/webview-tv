name: Build Debug

# PR 合进 main 之前先确认能编过，别等打 tag 才发现编译挂了。
# 只跑 assembleDebug：不签名、不发版、不上传产物，几块钱分钟机器时间就为一句“能编译”。
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 编译 debug 包
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
