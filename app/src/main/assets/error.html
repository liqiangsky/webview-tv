<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加载失败</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #070b14;
    color: #e8eefc;
    font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box { text-align: center; max-width: 900px; padding: 40px; }
  h1 { font-size: 46px; margin-bottom: 18px; }
  p { font-size: 24px; color: #8ea3c8; margin-bottom: 44px; line-height: 1.6; }
  .row { display: flex; gap: 32px; justify-content: center; }
  button {
    font-size: 28px;
    font-family: inherit;
    color: #e8eefc;
    background: linear-gradient(160deg, #152038, #101a2e);
    border: 4px solid transparent;
    border-radius: 16px;
    padding: 22px 54px;
    cursor: pointer;
    outline: none;
  }
  button:focus {
    border-color: #ffd447;
    box-shadow: 0 0 0 6px rgba(255, 212, 71, .25);
  }
</style>
</head>
<body>
<div class="box">
  <h1>页面加载失败</h1>
  <p>网络可能不通，或该网站拒绝了访问。按返回键可重试上一页。</p>
  <div class="row">
    <button id="retry">重试</button>
    <button id="home">回到首页</button>
  </div>
</div>
<script>
  var btns = [document.getElementById('retry'), document.getElementById('home')];
  btns[0].focus();

  document.getElementById('retry').onclick = function () { history.back(); };
  document.getElementById('home').onclick = function () {
    // 回原生首页：由 WebViewClient 拦截 tvhome:// 协议并关闭直播页
    location.href = 'tvhome://home';
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === '37' || e.key === '39') {
      e.preventDefault();
      var i = btns.indexOf(document.activeElement);
      var next = i === 1 ? 0 : (i === 0 ? 1 : 0);
      btns[next].focus();
    }
  });
</script>
</body>
</html>
