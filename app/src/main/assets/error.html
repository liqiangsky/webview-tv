<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加载失败</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #e8eefc;
    font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box { text-align: center; max-width: 900px; padding: 40px; }
  h1 { font-size: 46px; margin-bottom: 18px; }
  p { font-size: 24px; color: #8ea3c8; line-height: 1.6; }
</style>
</head>
<body>
<div class="box">
  <h1 id="ttl">页面加载失败</h1>
  <p id="tip">网络可能不通，或该网站拒绝了访问。按 OK 键呼出频道列表换台。</p>
</div>
<script>
  // 原生层带 ?msg= 过来时，整页只显示这一句居中文字
  var msg = new URLSearchParams(location.search).get('msg');
  if (msg) {
    document.getElementById('ttl').textContent = msg;
    document.getElementById('tip').textContent = '';
  }
</script>
</body>
</html>
