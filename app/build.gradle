plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 版本号：打 tag 构建时由 CI 传 -PversionName=1.2.3 -PversionCode=10203，本地不传就用默认值
// （versionCode 必须随版本递增，否则同签名的升级装不上）
def buildVersionName = (findProperty('versionName') ?: '1.0').toString()
def buildVersionCode = (findProperty('versionCode') ?: '1').toString().toInteger()

android {
    // namespace 只是源码包名（Kotlin 的 package 跟它走），applicationId 才是应用身份：
    // 它决定桌面图标认的是哪个应用、数据落在 /sdcard/Android/data/<applicationId>/、
    // 以及覆盖安装时能不能接上前一个版本。两者可以不同，改 ID 不等于要搬源文件。
    namespace 'com.tvlive.web'
    compileSdk 35

    defaultConfig {
        applicationId "com.inweb.tv"
        // 21 = Android 5.0：WebView 从这版起可以单独升级（能到 Chromium 95），
        // 再往下 4.4 的 WebView 冻在 Chromium 30 且永不可升级，MSE/现代 JS 都缺
        minSdk 21
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }

    // 正式签名：CI 把仓库 Secret 里的 keystore 解成文件，用环境变量把路径/口令传进来。
    // 密钥本身不进仓库；本地没这些变量时不配签名，assembleRelease 出来的就是未签名包。
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                // PKCS12 的密钥口令通常就是仓库口令，没单独给就重用
                keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有签名就签，没配就保持未签名（本地随便跑 assembleRelease 不会报错）
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // 只取 core：纯 Java 的二维码编码，无 Android 依赖、无传递依赖。
    // 二维码在本地算成 Bitmap，不请求任何第三方出图接口，配置地址不出内网。
    implementation 'com.google.zxing:core:3.5.3'
    // 频道列表要回收视图：一组上百个频道，全建真实 View 会在呼出面板时掉帧
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
