plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tvlive.web'
    compileSdk 35

    defaultConfig {
        applicationId "com.tvlive.web"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // 只取 core：纯 Java 的二维码编码，无 Android 依赖、无传递依赖。
    // 二维码在本地算成 Bitmap，不请求任何第三方出图接口，配置地址不出内网。
    implementation 'com.google.zxing:core:3.5.3'
    // 频道列表要回收视图：一组上百个频道，全建真实 View 会在呼出面板时掉帧
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
